# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

# stages:          # List of stages for jobs, and their order of execution
#   - build
#   - test
#   - deploy

# build-job:       # This job runs in the build stage, which runs first.
#   stage: build
#   script:
#     - echo "Compiling the code..."
#     - echo "Compile complete."

# unit-test-job:   # This job runs in the test stage.
#   stage: test    # It only starts when the job in the build stage completes successfully.
#   script:
#     - echo "Running unit tests... This will take about x seconds."
#     - sleep 60
#     - echo "Code coverage is 90%"


# deploy-job:      # This job runs in the deploy stage.
#   stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
#   environment: production
#   script:
#     - echo "Deploying application..."
#     - echo "Application successfully deployed."


    workflow:
        name: P8PIPELINE
        rules:
            - if: $CI_COMMIT_BRANCH == "main"
              when: always
            - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^feature/ && $CI_PIPELINE_SOURCE == 'merge_request_event'

    include:
      - template: Jobs/SAST.gitlab-ci.yml
      - template: Jobs/Secret-Detection.gitlab-ci.yml



    variables:
      DOTNET_VERSION: "7.0"
      SOLUTION_FILE: "~/source/~/TourGuide.sln"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      GITLAB_ADVANCED_SAST_ENABLED: 'true'
      SECRET_DETECTION_HISTORIC_SCAN: "true"

    .dotnet_cache: &dotnet_cache
      cache:
        key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
        paths:
          - .nuget/packages/
        policy: pull-push

    before_script:
      - dotnet --version
      - export NUGET_PACKAGES="$CI_PROJECT_DIR/.nuget/packages"

    build:
      stage: build
      image: mcr.microsoft.com/dotnet/sdk:7.0
      <<: *dotnet_cache
      script:
        - dotnet restore $SOLUTION_FILE
        - dotnet build $SOLUTION_FILE --configuration Release --no-restore
      artifacts:
        paths:
          - src/*/bin/
          - src/*/obj/
        expire_in: 1 hour

    test:
      stage: test
      image: mcr.microsoft.com/dotnet/sdk:7.0
      <<: *dotnet_cache
      dependencies:
        - build
      script:
        - dotnet test $SOLUTION_FILE --configuration Release --logger "junit;LogFilePath=$CI_PROJECT_DIR/TestResults/test-results.xml" --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory $CI_PROJECT_DIR/TestResults
        - find TestResults -name "coverage.cobertura.xml" -exec cp {} TestResults/coverage.cobertura.xml \;
        - COVERAGE=$(grep -o 'line-rate="[0-9.]*"' TestResults/coverage.cobertura.xml | head -1 | grep -o '[0-9.]*' | awk '{printf "%.1f", $1*100}')
        - echo "Total | ${COVERAGE}%"
      artifacts:
        when: always
        reports:
          junit: "TestResults/test-results.xml"
          coverage_report:
            coverage_format: cobertura
            path: "TestResults/coverage.cobertura.xml"
        paths:
          - TestResults/
        expire_in: 1 week
      coverage: '/Total\s*\|\s*(\d+(?:\.\d+)?)%/'



    stages:
        - build
        - test

    
    unit_test:
        stage: test
        image: node:alpine
        before_script:
            - npm install
        script:
            - npm run test




